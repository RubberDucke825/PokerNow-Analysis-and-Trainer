# Flop sizing table: texture bucket (pn.solve.flops.bucket_of) -> flop bet sizes (% pot).
# Each entry: 1..=2 sizes from {25, 33, 50, 100}.
#
# Hand-authored heuristics. pn.solve.texas reads this file at solve time when a spot's
# flop_bets is "auto" (the DEFAULT_SIZES value): the board's bucket entry, else [default]
# (_auto_flop_bets). The library preset keeps only the first size of the entry.

[default]
flop_bets = [33, 100]

[buckets.trips]
flop_bets = [33]

[buckets.paired_high]
flop_bets = [33]

[buckets.paired_low]
flop_bets = [33, 100]

[buckets.rainbow_ahigh]
flop_bets = [33]

[buckets.rainbow_bway]
flop_bets = [33, 100]

[buckets.rainbow_connected]
flop_bets = [50, 100]

[buckets.rainbow_high_dry]
flop_bets = [33]

[buckets.rainbow_low_dry]
flop_bets = [33, 100]

[buckets.twotone_ahigh]
flop_bets = [33, 100]

[buckets.twotone_bway]
flop_bets = [33, 100]

[buckets.twotone_connected]
flop_bets = [50, 100]

[buckets.twotone_high_dry]
flop_bets = [33, 100]

[buckets.twotone_low_dry]
flop_bets = [33, 100]

[buckets.mono_ahigh]
flop_bets = [25, 50]

[buckets.mono_bway]
flop_bets = [25, 50]

[buckets.mono_connected]
flop_bets = [33]

[buckets.mono_high_dry]
flop_bets = [25, 50]

[buckets.mono_low_dry]
flop_bets = [33]
